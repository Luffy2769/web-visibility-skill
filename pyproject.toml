[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "web-visibility-skill"
dynamic = ["version"]
description = "Deterministic website visibility auditor and Agent Skill foundation: technical SEO, metadata, headings, links, images and basic structured data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Raunak Rawat" }]
keywords = ["seo", "technical-seo", "audit", "crawler", "agent-skill", "structured-data", "web-visibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Every runtime dependency has one job:
#   httpx          - HTTP client with streaming (response size limits) and timeouts
#   beautifulsoup4 - tolerant HTML parsing of real-world (often malformed) pages
#   typer          - the command-line interface
#   rich           - human-friendly terminal report
#   defusedxml     - XML parsing that rejects DTDs/entities (sitemaps are untrusted input)
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "typer>=0.12",
    "rich>=13.7",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",  # only used by the SKILL.md manifest validation test
    "types-defusedxml",  # type stubs for mypy
    "types-PyYAML",
]

[project.scripts]
web-visibility = "web_visibility.cli:main"

[project.urls]
Homepage = "https://github.com/luffy2769/web-visibility-skill"
Repository = "https://github.com/luffy2769/web-visibility-skill"
Issues = "https://github.com/luffy2769/web-visibility-skill/issues"
Changelog = "https://github.com/luffy2769/web-visibility-skill/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/web_visibility/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/web_visibility"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "evals",
    ".agents",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: runs against the local fixture HTTP server"]

[tool.coverage.run]
source = ["web_visibility"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Tests embed long inline HTML snippets; wrapping them hurts readability.
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-local-folder = ["factories", "fixture_server", "fake_site"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "tests"
